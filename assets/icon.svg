  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <circle cx="256" cy="256" r="210" fill="url(#glow)" opacity="0.55"/>

  <g fill="#ffffff">
